schema_version: "1.0"
time:
  epoch_utc: "2025-01-01T00:00:00Z"
  traffic_interval_s: 300
  service_step_s: 1
  routing_step_s: 1
  orbit_update_s: 10
  telemetry_step_s: 1
  prediction_refresh_s: 300
  prediction_horizons: [1, 3]
units:
  time: s
  distance: km
  speed: km/s
  rate: Mbit/s
  volume: Mbit
  delay: s
  configured_angle: degree
orbit:
  constellation_type: walker_star
  total_satellites: 66
  planes: 6
  satellites_per_plane: 11
  phasing: 2
  altitude_km: 780.0
  inclination_deg: 86.4
  eccentricity: 0.0
  raan_span_deg: 180.0
  raan_spacing_deg: 30.0
  propagator: analytic_two_body_circular
earth:
  model: spherical
  radius_km: 6378.137
  mu_km3_s2: 398600.4418
  rotation_rad_s: 0.000072921159
  light_speed_km_s: 299792.458
isl:
  storage: directed_edges
  intra_plane_neighbors: 2
  inter_plane_neighbors_max: 2
  connect_star_seam: false
  inter_plane_pairing: mutual_nearest_then_sat_id
  crosslink_max_abs_lat_deg: 70.0
  require_earth_clearance: true
  max_distance_km: 5000.0
link:
  capacity_mbps: 1000.0
  buffer_delay_budget_s: 0.5
  max_wait_s: 5.0
  queue_discipline: fifo_fluid_volume
  update_order: arrivals_overflow_service
  failed_link_service_mbit: 0.0
coverage:
  ground_region_source: data/processed/geospatial/ground_regions.csv
  ground_altitude_km: 0.0
  minimum_elevation_deg: 10.0
  selection: maximum_elevation_then_sat_id
  uncovered_behavior: access_backlog
  refresh_s: 10
demand_calibration:
  allowed_split: train
  behavior_policy: dijkstra
  scenario: normal_complete_no_failure
  statistic: p90_active_link_mean_utilization_per_traffic_interval
  target: 0.60
  accepted_min: 0.55
  accepted_max: 0.65
  search_min: 0.001
  search_max: 1000.0
  max_iterations: 30
  relative_tolerance: 0.01
seeds:
  development: 202500
  formal: [202501, 202502, 202503, 202504, 202505]
  derivation: numpy_seedsequence
  key_order: [master_seed, scenario_id, policy_id, module_id, replicate_id]
  module_ids:
    demand: 1
    burst: 2
    failure: 3
    missing: 4
    behavior_policy: 5
    model_init: 6
    rl_env: 7
