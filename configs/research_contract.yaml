title: 面向不完整遥测的置信度感知低轨卫星网络流量预测与韧性路由
research_questions:
  - id: RQ1
    text: 联合使用路由状态、缺失掩码、信息年龄和动态拓扑，能否改善不完整遥测下的链路流量预测及跨策略泛化？
  - id: RQ2
    text: 因果、延迟标签感知的预测区间能否在动态拓扑、非随机缺失和分布变化下维持接近90%的覆盖？
  - id: RQ3
    text: 显式使用预测区间、状态新鲜度和拥塞风险后，是否能在错误预测、突发和故障下改善尾部时延与丢包？
